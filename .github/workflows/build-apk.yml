
name: Build Valmiki Tiger Watch APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform if not present
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate official Valmiki Tiger Watch Android launcher icons
        run: node scripts/generate-android-icons.js

      - name: Sync Android project
        run: npx cap sync android
     
      - name: Align Kotlin dependencies and prevent conflicts
        run: |
          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          if (details.requested.name == "kotlin-stdlib-jdk7" || details.requested.name == "kotlin-stdlib-jdk8") {
                              details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:2.2.20")
                          } else if (details.requested.name.startsWith("kotlin-stdlib")) {
                              details.useVersion("2.2.20")
                          }
                      }
                  }
              }
          }
          EOF
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --init-script ../kotlin-fix.gradle
          
      - name: Prepare named APK artifact
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Valmiki-Tiger-Watch-v1.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Valmiki-Tiger-Watch-v1.0.1-APK
          path: release-apk/Valmiki-Tiger-Watch-v1.0.1.apk

      - name: Create or Update GitHub Release v1.0.1
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.1
          name: Valmiki Tiger Watch v1.0.1
          body: |
            Updated the Android launcher icon with the official Valmiki Tiger Watch logo.
          files: release-apk/Valmiki-Tiger-Watch-v1.0.1.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
